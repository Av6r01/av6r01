<linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#8b9cff"/><stop offset="100%" stop-color="#50d6c8"/></linearGradient>
<symbol id="i-star" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 21 12 17.77 5.82 21 7 14.14 2 9.27l6.91-1.01L12 2z"/></symbol><symbol id="i-fork" viewBox="0 0 24 24"><line x1="6" y1="3" x2="6" y2="15"/><circle cx="18" cy="6" r="2.4"/><circle cx="6" cy="18" r="2.4"/><path d="M18 8.4A8.4 8.4 0 0 1 9.6 16.8"/></symbol><symbol id="i-link" viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></symbol><symbol id="i-code" viewBox="0 0 24 24"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></symbol><symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></symbol><symbol id="i-activity" viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></symbol><symbol id="i-repo" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></symbol><symbol id="i-users" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></symbol>
</defs>
<style>.fade-up{opacity:0;animation:fadeUp .7s cubic-bezier(.22,.7,.3,1) forwards}
.fade-in{opacity:0;animation:fadeIn .6s ease forwards}
.pulse{animation:pulse 2.6s ease-in-out infinite}
.drift{animation:drift 10s ease-in-out infinite}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(14px,-10px)}}</style>
<rect width="1100" height="260" rx="22" fill="#0b1020"/>
<circle cx="940" cy="-20" r="150" fill="#6579e8" opacity="0.08" class="drift"/>
<circle cx="35" cy="210" r="110" fill="#50d6c8" opacity="0.045" class="drift"/>
<rect x="28" y="28" width="1044" height="204" rx="18" fill="#0f1930" stroke="#263653" stroke-width="1.2"/>
<rect x="28" y="28" width="6" height="204" rx="3" fill="url(#glow)"/>
<clipPath id="avatarClip"><circle cx="112" cy="130" r="54"/></clipPath>
<circle cx="112" cy="130" r="63" fill="none" stroke="url(#glow)" stroke-width="2.4" stroke-dasharray="4 7" stroke-linecap="round" opacity="0.85"><animateTransform attributeName="transform" type="rotate" from="0 112 130" to="360 112 130" dur="18s" repeatCount="indefinite"/></circle>
<circle cx="112" cy="130" r="56" fill="#14213a" class="pulse"/>
<image href="data:image/jpeg;base64," x="58" y="76" width="108" height="108" clip-path="url(#avatarClip)" preserveAspectRatio="xMidYMid slice"/>
<use href="#i-shield" x="210" y="56" width="16" height="16" fill="none" stroke="#50d6c8" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/>
<text x="232" y="70" fill="#50d6c8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="start" letter-spacing="2.0">GITHUB PROFILE  /  01</text>
<g class="fade-up" style="animation-delay:.05s"><text x="210" y="128" fill="#edf3ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="36" font-weight="750" text-anchor="start" letter-spacing="0">Avay Charan Das</text></g>
<clipPath id="roleReveal"><rect x="208" y="146" width="0" height="26"><animate attributeName="width" from="0" to="453" dur="1.5s" begin="0.3s" fill="freeze" calcMode="spline" keySplines="0.25 0.7 0.3 1"/></rect></clipPath>
<g clip-path="url(#roleReveal)"><text x="210" y="164" fill="#9aabc6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="650" text-anchor="start" letter-spacing="1.25">CYBERSECURITY / NETWORKING / SOFTWARE DEVELOPMENT</text></g>
<rect x="208" y="150" width="2" height="15" fill="#50d6c8" class="pulse"><animate attributeName="x" from="208" to="661" dur="1.5s" begin="0.3s" fill="freeze"/></rect>
<g class="fade-up" style="animation-delay:.5s"><text x="210" y="198" fill="#c6d2e7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start" letter-spacing="0">Learning by building. Focused on practical, secure software.</text></g>
<rect x="820" y="68" width="215" height="124" rx="14" fill="#14213a" stroke="#2b3a59"/>
<text x="842" y="102" fill="#9aabc6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="700" text-anchor="start" letter-spacing="1.1">PUBLIC REPOSITORIES</text>
<g class="fade-up" style="animation-delay:.2s"><text x="842" y="139" fill="#edf3ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27" font-weight="750" text-anchor="start" letter-spacing="0">20</text></g>
<use href="#i-star" x="842" y="156" width="13" height="13" fill="#50d6c8"/>
<text x="861" y="171" fill="#50d6c8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" text-anchor="start" letter-spacing="0">0 total stars  ·  @av6r01</text>
<text x="1037" y="218" fill="#9aabc6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9" font-weight="600" text-anchor="end" letter-spacing="1.2">BUILD  /  LEARN  /  SECURE</text>
</svg>