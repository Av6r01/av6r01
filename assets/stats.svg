<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="225" viewBox="0 0 1100 225" role="img" aria-label="GitHub statistics">
<title>GitHub statistics</title>
<defs>
<linearGradient id="glow" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#8b9cff"/><stop offset="100%" stop-color="#50d6c8"/></linearGradient>
<linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#8b9cff"/><stop offset="100%" stop-color="#50d6c8"/></linearGradient>
<symbol id="i-star" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 21 12 17.77 5.82 21 7 14.14 2 9.27l6.91-1.01L12 2z"/></symbol><symbol id="i-fork" viewBox="0 0 24 24"><line x1="6" y1="3" x2="6" y2="15"/><circle cx="18" cy="6" r="2.4"/><circle cx="6" cy="18" r="2.4"/><path d="M18 8.4A8.4 8.4 0 0 1 9.6 16.8"/></symbol><symbol id="i-link" viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></symbol><symbol id="i-code" viewBox="0 0 24 24"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></symbol><symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></symbol><symbol id="i-activity" viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></symbol><symbol id="i-repo" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></symbol><symbol id="i-users" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></symbol>
</defs>
<style>.fade-up{opacity:0;animation:fadeUp .7s cubic-bezier(.22,.7,.3,1) forwards}
.fade-in{opacity:0;animation:fadeIn .6s ease forwards}
.pulse{animation:pulse 2.6s ease-in-out infinite}
.drift{animation:drift 10s ease-in-out infinite}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(14px,-10px)}}</style>
<rect width="1100" height="225" rx="22" fill="#0b1020"/>
<circle cx="940" cy="-20" r="150" fill="#6579e8" opacity="0.08" class="drift"/>
<circle cx="35" cy="210" r="110" fill="#50d6c8" opacity="0.045" class="drift"/>
<use href="#i-activity" x="38" y="30" width="14" height="14" fill="none" stroke="#50d6c8" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/>
<text x="60" y="42" fill="#50d6c8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="start" letter-spacing="1.8">GITHUB SIGNALS</text>
<text x="1060" y="42" fill="#9aabc6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" text-anchor="end" letter-spacing="1.1">LIVE DATA FROM GITHUB API</text>
<g class="fade-up" style="animation-delay:0.00s">
<rect x="34.0" y="62" width="195.2" height="126" rx="14" fill="#111a2e" stroke="#263653"/>
<use href="#i-repo" x="195.2" y="76" width="15" height="15" fill="none" stroke="#8b9cff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="51.0" y="91" fill="#9aabc6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="700" text-anchor="start" letter-spacing="0.7">PUBLIC REPOSITORIES</text>
<text x="51.0" y="139" fill="#edf3ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="750" text-anchor="start" letter-spacing="0">20</text>
<text x="51.0" y="166" fill="#50d6c8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="500" text-anchor="start" letter-spacing="0">Owned public projects</text>
</g>
<g class="fade-up" style="animation-delay:0.08s">
<rect x="243.2" y="62" width="195.2" height="126" rx="14" fill="#111a2e" stroke="#263653"/>
<use href="#i-star" x="404.4" y="76" width="15" height="15" fill="#8b9cff"/>
<text x="260.2" y="91" fill="#9aabc6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="700" text-anchor="start" letter-spacing="0.7">TOTAL STARS</text>
<text x="260.2" y="139" fill="#edf3ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="750" text-anchor="start" letter-spacing="0">0</text>
<text x="260.2" y="166" fill="#50d6c8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="500" text-anchor="start" letter-spacing="0">Across public repositories</text>
</g>
<g class="fade-up" style="animation-delay:0.16s">
<rect x="452.4" y="62" width="195.2" height="126" rx="14" fill="#111a2e" stroke="#263653"/>
<use href="#i-users" x="613.5999999999999" y="76" width="15" height="15" fill="none" stroke="#8b9cff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="469.4" y="91" fill="#9aabc6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="700" text-anchor="start" letter-spacing="0.7">FOLLOWERS</text>
<text x="469.4" y="139" fill="#edf3ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="750" text-anchor="start" letter-spacing="0">0</text>
<text x="469.4" y="166" fill="#50d6c8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="500" text-anchor="start" letter-spacing="0">GitHub community</text>
</g>
<g class="fade-up" style="animation-delay:0.24s">
<rect x="661.6" y="62" width="195.2" height="126" rx="14" fill="#111a2e" stroke="#263653"/>
<use href="#i-fork" x="822.8" y="76" width="15" height="15" fill="none" stroke="#8b9cff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="678.5999999999999" y="91" fill="#9aabc6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="700" text-anchor="start" letter-spacing="0.7">TOTAL FORKS</text>
<text x="678.5999999999999" y="139" fill="#edf3ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="750" text-anchor="start" letter-spacing="0">0</text>
<text x="678.5999999999999" y="166" fill="#50d6c8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="500" text-anchor="start" letter-spacing="0">Community copies</text>
</g>
<g class="fade-up" style="animation-delay:0.32s">
<rect x="870.8" y="62" width="195.2" height="126" rx="14" fill="#111a2e" stroke="#263653"/>
<use href="#i-activity" x="1032.0" y="76" width="15" height="15" fill="none" stroke="#8b9cff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="887.8" y="91" fill="#9aabc6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="700" text-anchor="start" letter-spacing="0.7">CONTRIBUTIONS · 2026</text>
<text x="887.8" y="139" fill="#edf3ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="750" text-anchor="start" letter-spacing="0">0</text>
<text x="887.8" y="166" fill="#50d6c8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="500" text-anchor="start" letter-spacing="0">GitHub contribution calendar</text>
</g>
<text x="38" y="211" fill="#9aabc6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" text-anchor="start" letter-spacing="0">Counts reflect public GitHub data; contribution totals depend on API access.</text>
</svg>