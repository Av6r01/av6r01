<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="260" viewBox="0 0 1100 260" role="img" aria-label="Avay Charan Das GitHub profile banner">
<title>Avay Charan Das GitHub profile banner</title>
<defs>
